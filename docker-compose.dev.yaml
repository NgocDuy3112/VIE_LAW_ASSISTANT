services:
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgresql-backend:
    container_name: postgresql-backend
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_BACKEND_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BACKEND_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BACKEND_DB}
    env_file:
      - configs/.env
    networks:
      - default
    volumes:
      - ./data/postgresql-backend/user:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BACKEND_USER} -d ${POSTGRES_BACKEND_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
  
  postgresql-agent:
    container_name: postgresql-agent
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_AGENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGENT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AGENT_DB}
    env_file:
      - configs/.env
    networks:
      - default
    volumes:
      - ./data/postgresql-agent/user:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AGENT_USER} -d ${POSTGRES_AGENT_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  backend:
    container_name: backend
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./backend/src:/src/src
      - ./backend/prisma:/src/prisma
    env_file:
      - ./configs/.env
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - postgresql-backend
    networks:
      - default

  agent:
    container_name: agent
    build:
      context: ./agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./agent/app:/src/app
      - ./configs/.env:/src/configs/.env
    environment:
      - ENV_FILE=/src/configs/.env
      - PYTHONPATH=/src
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - elasticsearch
      - postgresql-agent
    networks:
      - default

  data-pipeline:
    container_name: data-pipeline
    build:
      context: ./data-pipeline
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./data-pipeline/app:/src/app
      - ./configs/.env:/src/configs/.env
      - ./data/pdfs:/src/data/pdfs
    environment:
      - PYTHONPATH=/src
      - TZ=Asia/Ho_Chi_Minh
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - elasticsearch
    networks:
      - default

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - agent
    networks:
      - default

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - default

  grafana:
    container_name: grafana
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default
  
  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - default

  postgres-exporter-backend:
    container_name: postgres-exporter-backend
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_BACKEND_USER}:${POSTGRES_BACKEND_PASSWORD}@postgresql-backend:5432/${POSTGRES_BACKEND_DB}?sslmode=disable
    env_file:
      - configs/.env
    ports:
      - "9187:9187"
    depends_on:
      - postgresql-backend
    networks:
      - default

  postgres-exporter-agent:
    container_name: postgres-exporter-agent
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_AGENT_USER}:${POSTGRES_AGENT_PASSWORD}@postgresql-agent:5432/${POSTGRES_AGENT_DB}?sslmode=disable
    env_file:
      - configs/.env
    ports:
      - "9188:9187"
    depends_on:
      - postgresql-agent
    networks:
      - default

  elasticsearch-exporter:
    container_name: elasticsearch-exporter
    image: prometheuscommunity/elasticsearch-exporter:latest
    restart: unless-stopped
    command:
      - '--es.uri=http://elasticsearch:9200'
    ports:
      - "9114:9114"
    depends_on:
      - elasticsearch
    networks:
      - default

networks:
  default:
    driver: bridge
