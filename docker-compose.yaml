services:
  valkey-rate-limit:
    container_name: valkey-rate-limit
    image: valkey/valkey:8.1.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./configs/valkey-rate-limit.conf:/configs/valkey.conf
      - ./data/valkey-rate-limit:/data
    command: valkey-server /configs/valkey.conf
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vie-law-assistant-network
    profiles:
      - testing
      - developer
      - production

  valkey-cache:
    container_name: valkey-cache
    image: valkey/valkey:8.1.1-alpine
    restart: unless-stopped
    ports:
      - "6380:6380"
    volumes:
      - ./configs/valkey-cache.conf:/configs/valkey.conf
      - ./data/valkey-cache:/data
    command: valkey-server /configs/valkey.conf
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vie-law-assistant-network
    profiles:
      - developer
      - production

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.15.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__PATH=/qdrant/storage
    networks:
      - vie-law-assistant-network
    profiles:
      - developer
      - production

  postgresql-user:
    container_name: postgresql-user
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user
    networks:
      - vie-law-assistant-network
    volumes:
      - ./data/postgresql/user:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    profiles:
      - production
      - developer

  backend:
    container_name: backend
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/src/src
      - ./backend/prisma:/src/prisma
    env_file:
      - ./configs/.env.backend
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgresql-user
    networks:
      - vie-law-assistant-network
    profiles:
      - developer
      - production

  agent:
    container_name: agent
    build:
      context: ./agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./agent/app:/src/app
      - ./configs/.env.agent:/src/configs/.env
      - ./encoders/embedding:/src/encoders/embedding
      - ./encoders/sparse-embedding:/src/encoders/sparse-embedding
    environment:
      - ENV_FILE=/src/configs/.env
      - PYTHONPATH=/src
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - valkey-rate-limit
      - qdrant
      - valkey-cache
    networks:
      - vie-law-assistant-network
    profiles:
      - testing
      - developer
      - production

  crawler:
    container_name: crawler
    build:
      context: ./crawler
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./crawler/app:/src/app
    environment:
      - PYTHONPATH=/src
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    networks:
      - vie-law-assistant-network
    profiles:
      - developer
      - production



networks:
  vie-law-assistant-network:
    driver: bridge