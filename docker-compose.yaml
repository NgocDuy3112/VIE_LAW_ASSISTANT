services:
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgresql-backend:
    container_name: postgresql-backend
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_BACKEND_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BACKEND_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BACKEND_DB}
    env_file:
      - configs/.env
    networks:
      - default
    volumes:
      - ./data/postgresql-backend/user:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BACKEND_USER} -d ${POSTGRES_BACKEND_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
  
  postgresql-agent:
    container_name: postgresql-agent
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_AGENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGENT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AGENT_DB}
    env_file:
      - configs/.env
    networks:
      - default
    volumes:
      - ./data/postgresql-agent/user:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AGENT_USER} -d ${POSTGRES_AGENT_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  backend:
    container_name: backend
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/src/src
      - ./backend/prisma:/src/prisma
    env_file:
      - ./configs/.env
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - postgresql-backend
    networks:
      - default

  agent:
    container_name: agent
    build:
      context: ./agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./agent/app:/src/app
      - ./configs/.env:/src/configs/.env
    environment:
      - ENV_FILE=/src/configs/.env
      - PYTHONPATH=/src
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - elasticsearch
      - postgresql-agent
    networks:
      - default

  data-pipeline:
    container_name: data-pipeline
    build:
      context: ./data-pipeline
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data-pipeline/app:/src/app
      - ./configs/.env:/src/configs/.env
      - ./data/pdfs:/src/data/pdfs
    environment:
      - PYTHONPATH=/src
      - TZ=Asia/Ho_Chi_Minh
    entrypoint: /src/entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - elasticsearch
    networks:
      - default



  frontend:
    container_name: frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - agent
    networks:
      - default

networks:
  default:
    driver: bridge
